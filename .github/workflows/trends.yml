name: Coleta Google Trends

# O agendamento do GitHub é pouco confiável: pedido a cada 10 minutos, rodou em média a cada 3,4 horas
# (15 a 19/out/2026). Por isso cada execução fica ligada quase 2 horas e lê o feed a cada 5 minutos.
# Basta o GitHub iniciar uma execução a cada 2 horas para a cobertura ficar contínua.
# Repositório público: os minutos do GitHub Actions são ilimitados.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coletores/trends.py", ".github/workflows/trends.yml"]

permissions:
  contents: write

concurrency:
  group: coleta-trends
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ler o feed a cada 5 minutos por cerca de 110 minutos
        run: |
          git config user.name "coletor-saloint"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fim=$((SECONDS + 110 * 60))
          ok=0; falhas=0
          while [ $SECONDS -lt $fim ]; do
            if python3 coletores/trends.py; then ok=$((ok + 1)); else falhas=$((falhas + 1)); echo "leitura falhou; tenta de novo no próximo ciclo"; fi
            git add dados
            if ! git diff --cached --quiet; then
              git commit -q -m "Leitura do Google Trends $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q || echo "push falhou; vai junto no próximo ciclo"
            fi
            sleep 300
          done
          # Execução verde com dado nenhum já aconteceu (22 a 26/out/2026). Mais da metade das leituras
          # falhando deixa a execução vermelha, e o GitHub manda e-mail.
          echo "leituras ok: $ok; falhas: $falhas"
          if [ $falhas -gt $ok ]; then echo "::error::mais falhas que leituras ($falhas de $((ok + falhas)))"; exit 1; fi
