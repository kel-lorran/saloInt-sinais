name: Coleta Google Trends

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub atrasa ou pula execuções; pedir mais vezes compensa)
  workflow_dispatch:        # botão "Run workflow" para rodar na mão
  push:
    branches: [main]
    paths: ["coletores/**", ".github/workflows/trends.yml"]

permissions:
  contents: write

concurrency:
  group: coleta-trends
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ler o feed
        run: python3 coletores/trends.py
      - name: Gravar no repositório
        run: |
          git config user.name "coletor-saloint"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "nada novo"
          else
            git commit -q -m "Leitura do Google Trends $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
          fi
